openapi: 3.0.0
info:
  title: Vulnerability Test API
  version: 1.0.0
paths:
  /test:
    get:
      summary: '"><img src=x onerror=alert(`XSS-summary`)>'
      description: |
        This endpoint is for testing Swagger UI rendering of malicious content.

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: '"><script>alert(`XSS-example`)</script>'
